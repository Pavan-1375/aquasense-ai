services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aquasense
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aquasense-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense -d aquasense"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEVICE_INGEST_KEY: ${DEVICE_INGEST_KEY:?Set DEVICE_INGEST_KEY in .env}
      DATABASE_URL: postgresql+psycopg://aquasense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aquasense
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?Set EMAIL_PROVIDER in .env}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SCHEMA_AUTO_CREATE: "false"
      SCHEDULER_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  aquasense-db:
