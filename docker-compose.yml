services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aquasense
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aquasense-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense -d aquasense"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEVICE_INGEST_KEY: ${DEVICE_INGEST_KEY:?Set DEVICE_INGEST_KEY in .env}
      DATABASE_URL: postgresql+psycopg://aquasense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aquasense
      CORS_ORIGINS: http://localhost:5173
      SCHEMA_AUTO_CREATE: "false"
      SCHEDULER_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  aquasense-db:
